<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <linearGradient id="goldGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5e6c4"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="12" fill="url(#darkGrad)"/>
  <!-- Camera body -->
  <rect x="55" y="35" width="90" height="50" rx="8" fill="#2d2d44" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Lens outer ring -->
  <circle cx="100" cy="55" r="22" fill="#1a1a2e" stroke="#d4af37" stroke-width="2"/>
  <!-- Lens inner -->
  <circle cx="100" cy="55" r="14" fill="#0f0f1a"/>
  <circle cx="100" cy="55" r="8" fill="#2a2a4a"/>
  <circle cx="96" cy="51" r="3" fill="rgba(255,255,255,0.3)"/>
  <!-- Top flash/hot shoe -->
  <rect x="85" y="30" width="30" height="8" rx="2" fill="#d4af37"/>
  <!-- Shutter button -->
  <circle cx="135" cy="36" r="5" fill="#d4af37"/>
  <!-- Text below -->
  <text x="100" y="105" font-family="Georgia, serif" font-size="16" fill="#d4af37" text-anchor="middle" font-style="italic">Faryta Studio</text>
</svg>